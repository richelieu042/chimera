canvas#starCanvas {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    pointer-events: none;
    z-index: 0
}

.page {
    min-height: 100vh;
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    -webkit-box-orient: vertical;
    -webkit-box-direction: normal;
    -ms-flex-direction: column;
    flex-direction: column;
    -webkit-box-align: center;
    -ms-flex-align: center;
    align-items: center;
    -webkit-box-pack: center;
    -ms-flex-pack: center;
    justify-content: center;
    text-align: center;
    padding: 2rem 1.5rem;
    position: relative;
    z-index: 1
}

.scene {
    position: relative;
    width: 380px;
    max-width: 88%;
    margin-bottom: 1.8rem
}

.scene svg {
    width: 100%;
    height: auto
}

@-webkit-keyframes float {
    0%, 100% {
        -webkit-transform: translateY(0) rotate(-2deg);
        transform: translateY(0) rotate(-2deg)
    }
    50% {
        -webkit-transform: translateY(-16px) rotate(2deg);
        transform: translateY(-16px) rotate(2deg)
    }
}

@keyframes float {
    0%, 100% {
        -webkit-transform: translateY(0) rotate(-2deg);
        transform: translateY(0) rotate(-2deg)
    }
    50% {
        -webkit-transform: translateY(-16px) rotate(2deg);
        transform: translateY(-16px) rotate(2deg)
    }
}

@-webkit-keyframes spin-slow {
    from {
        -webkit-transform: rotate(0);
        transform: rotate(0)
    }
    to {
        -webkit-transform: rotate(360deg);
        transform: rotate(360deg)
    }
}

@keyframes spin-slow {
    from {
        -webkit-transform: rotate(0);
        transform: rotate(0)
    }
    to {
        -webkit-transform: rotate(360deg);
        transform: rotate(360deg)
    }
}

@-webkit-keyframes pulse-stars {
    0%, 100% {
        opacity: .5
    }
    50% {
        opacity: 1
    }
}

@keyframes pulse-stars {
    0%, 100% {
        opacity: .5
    }
    50% {
        opacity: 1
    }
}

.spaceman-group {
    -webkit-animation: float 4s ease-in-out infinite;
    animation: float 4s ease-in-out infinite;
    -webkit-transform-origin: 310px 380px;
    transform-origin: 310px 380px
}

.planet-group {
    -webkit-animation: spin-slow 50s linear infinite;
    animation: spin-slow 50s linear infinite;
    -webkit-transform-origin: 572px 109px;
    transform-origin: 572px 109px
}

.stars-group {
    -webkit-animation: pulse-stars 3s ease-in-out infinite;
    animation: pulse-stars 3s ease-in-out infinite
}

.code-num {
    font-size: 96px;
    font-weight: 800;
    letter-spacing: -3px;
    line-height: 1;
    margin-bottom: 6px;
    display: block
}

.title {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 10px;
    letter-spacing: .02em
}

.subtitle {
    font-size: 15px;
    max-width: 360px;
    line-height: 1.75;
    font-weight: 300
}

.theme-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 10;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    -webkit-transition: background-color .2s;
    transition: background-color .2s;
    outline: 0
}

@media (max-width: 480px) {
    .code-num {
        font-size: 72px
    }

    .title {
        font-size: 18px
    }

    .subtitle {
        font-size: 13px
    }
}

@media (max-width: 360px) {
    .code-num {
        font-size: 56px
    }
